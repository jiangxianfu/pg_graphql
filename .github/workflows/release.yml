name: Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body: |
            Changes in this Release
            - First Change
            - Second Change
          draft: false
          prerelease: false

  build-linux-gnu:
    name: release artifacts
    needs:
      - release
    strategy:
      matrix:
        extension_name:
          - pg_graphql
        package_name:
          - pg-graphql
        pgrx_version:
          - 0.16.1
        postgres: [14, 15, 16, 17, 18]
        box:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: u22-arm-runner, arch: arm64 }
    runs-on: ${{ matrix.box.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3

      - name: build release artifacts
        run: |
          # Install wget if missing
          sudo apt-get update
          sudo apt-get install -y wget

          # Add postgres package repo
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc &>/dev/null

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential libpq-dev curl libreadline6-dev zlib1g-dev pkg-config cmake
          sudo apt-get install -y --no-install-recommends libreadline-dev zlib1g-dev flex bison libxml2-dev libxslt-dev libssl-dev libxml2-utils xsltproc ccache
          sudo apt-get install -y --no-install-recommends clang libclang-dev gcc tree

          # Install requested postgres version
          sudo apt install -y postgresql-${{ matrix.postgres }} postgresql-server-dev-${{ matrix.postgres }} -y

          # Ensure installed pg_config is first on path
          export PATH=$PATH:/usr/lib/postgresql/${{ matrix.postgres }}/bin

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable && \
            rustup --version && \
            rustc --version && \
            cargo --version

          # Ensure cargo/rust on path
          source "$HOME/.cargo/env"

          cargo install cargo-pgrx --version ${{ matrix.pgrx_version }} --locked
          cargo pgrx init --pg${{ matrix.postgres }}=/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config

          # Explicitly specify pg_config to avoid version detection conflicts
          cargo pgrx package --pg-config /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config --no-default-features --features pg${{ matrix.postgres }}

          # Create installable package
          mkdir archive
          cp `find target/release -type f -name "${{ matrix.extension_name }}*"` archive

          # name of the package directory before packaging
          package_dir="${{ matrix.extension_name }}-${{ github.ref_name }}-pg${{ matrix.postgres }}-${{ matrix.box.arch }}-linux-gnu"

          # Copy files into directory structure
          mkdir -p ${package_dir}/usr/lib/postgresql/lib
          mkdir -p ${package_dir}/var/lib/postgresql/extension
          cp archive/*.so ${package_dir}/usr/lib/postgresql/lib
          cp archive/*.control ${package_dir}/var/lib/postgresql/extension
          cp archive/*.sql ${package_dir}/var/lib/postgresql/extension

          # symlinks to Copy files into directory structure
          mkdir -p ${package_dir}/usr/lib/postgresql/${{ matrix.postgres }}/lib
          cd ${package_dir}/usr/lib/postgresql/${{ matrix.postgres }}/lib
          cp -s ../../lib/*.so .
          cd ../../../../../..

          mkdir -p ${package_dir}/usr/share/postgresql/${{ matrix.postgres }}/extension
          cd ${package_dir}/usr/share/postgresql/${{ matrix.postgres }}/extension

          cp -s ../../../../../var/lib/postgresql/extension/${{ matrix.extension_name }}.control .
          cp -s ../../../../../var/lib/postgresql/extension/${{ matrix.extension_name }}*.sql .
          cd ../../../../../..

          # Create install control file
          extension_version="${{ github.ref_name }}"
          # strip the leading v
          deb_version=${extension_version:1}

          mkdir -p ${package_dir}/DEBIAN
          touch ${package_dir}/DEBIAN/control
          echo 'Package: ${{ matrix.package_name }}' >> ${package_dir}/DEBIAN/control
          echo 'Version:' ${deb_version} >> ${package_dir}/DEBIAN/control
          echo 'Architecture: ${{ matrix.box.arch }}' >> ${package_dir}/DEBIAN/control
          echo 'Maintainer: supabase' >> ${package_dir}/DEBIAN/control
          echo 'Description: A PostgreSQL extension' >> ${package_dir}/DEBIAN/control

          # Create deb package
          sudo chown -R root:root ${package_dir}
          sudo chmod -R 00755 ${package_dir}
          sudo dpkg-deb --build --root-owner-group ${package_dir}

      - name: Get upload url
        run: echo UPLOAD_URL=$(curl --silent https://api.github.com/repos/${{ github.repository }}/releases/latest | jq .upload_url --raw-output) >> $GITHUB_ENV

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: ./${{ matrix.extension_name }}-${{ github.ref_name }}-pg${{ matrix.postgres }}-${{ matrix.box.arch }}-linux-gnu.deb
          asset_name: ${{ matrix.extension_name }}-${{ github.ref_name }}-pg${{ matrix.postgres }}-${{ matrix.box.arch }}-linux-gnu.deb
          asset_content_type: application/vnd.debian.binary-package

  build-alma9-rpm:
    name: release rpm artifacts for AlmaLinux 9
    needs:
      - release
    strategy:
      matrix:
        extension_name:
          - pg_graphql
        package_name:
          - pg-graphql
        pgrx_version:
          - 0.16.1
        postgres: [14, 15, 16, 17, 18]
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3

      - name: build rpm release artifacts
        run: |
          # Install basic tools
          
          dnf install -y epel-release
          dnf config-manager --set-enabled crb

          dnf install -y wget git gcc gcc-c++ make cmake rpm-build rpmdevtools jq

          # Add PostgreSQL repository
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm

          # Disable PostgreSQL module to use PGDG packages
          dnf -qy module disable postgresql

          # Install PostgreSQL development packages
          dnf install -y postgresql${{ matrix.postgres }}-server postgresql${{ matrix.postgres }}-devel

          # Install additional dependencies
          dnf install -y openssl-devel readline-devel zlib-devel libxml2-devel libxslt-devel clang-devel pkg-config

          # Ensure installed pg_config is first on path
          export PATH=/usr/pgsql-${{ matrix.postgres }}/bin:$PATH

          # Install Rust
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"

          rustup --version
          rustc --version
          cargo --version

          # Install cargo-pgrx
          cargo install cargo-pgrx --version ${{ matrix.pgrx_version }} --locked
          cargo pgrx init --pg${{ matrix.postgres }}=/usr/pgsql-${{ matrix.postgres }}/bin/pg_config

          # Build the extension
          cargo pgrx package --pg-config /usr/pgsql-${{ matrix.postgres }}/bin/pg_config --no-default-features --features pg${{ matrix.postgres }}

          # Create installable package
          mkdir -p archive
          cp `find target/release -type f -name "${{ matrix.extension_name }}*"` archive

          # Setup RPM build environment
          rpmdev-setuptree

          # Prepare version
          extension_version="${{ github.ref_name }}"
          rpm_version=${extension_version:1}  # strip the leading v

          # Create RPM spec file
          cat > ~/rpmbuild/SPECS/${{ matrix.package_name }}.spec <<EOF
          Name:           ${{ matrix.package_name }}
          Version:        ${rpm_version}
          Release:        1%{?dist}
          Summary:        A PostgreSQL extension
          License:        Apache-2.0
          URL:            https://github.com/${{ github.repository }}

          %description
          A PostgreSQL extension built with pgrx

          %install
          mkdir -p %{buildroot}/usr/pgsql-${{ matrix.postgres }}/lib
          mkdir -p %{buildroot}/usr/pgsql-${{ matrix.postgres }}/share/extension

          cp ${GITHUB_WORKSPACE}/archive/*.so %{buildroot}/usr/pgsql-${{ matrix.postgres }}/lib/
          cp ${GITHUB_WORKSPACE}/archive/*.control %{buildroot}/usr/pgsql-${{ matrix.postgres }}/share/extension/
          cp ${GITHUB_WORKSPACE}/archive/*.sql %{buildroot}/usr/pgsql-${{ matrix.postgres }}/share/extension/

          %files
          /usr/pgsql-${{ matrix.postgres }}/lib/*.so
          /usr/pgsql-${{ matrix.postgres }}/share/extension/${{ matrix.extension_name }}.control
          /usr/pgsql-${{ matrix.postgres }}/share/extension/${{ matrix.extension_name }}*.sql

          %changelog
          * $(date "+%a %b %d %Y") Supabase <support@supabase.io> - ${rpm_version}-1
          - Release ${rpm_version}
          EOF

          # Build RPM package
          rpmbuild -bb ~/rpmbuild/SPECS/${{ matrix.package_name }}.spec

          # Copy the RPM to workspace
          cp ~/rpmbuild/RPMS/x86_64/${{ matrix.package_name }}-${rpm_version}-1.el9.x86_64.rpm ./${{ matrix.extension_name }}-${{ github.ref_name }}-pg${{ matrix.postgres }}-x86_64-alma9.rpm

      - name: Get upload url
        run: echo UPLOAD_URL=$(curl --silent https://api.github.com/repos/${{ github.repository }}/releases/latest | jq .upload_url --raw-output) >> $GITHUB_ENV

      - name: Upload rpm release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: ./${{ matrix.extension_name }}-${{ github.ref_name }}-pg${{ matrix.postgres }}-x86_64-alma9.rpm
          asset_name: ${{ matrix.extension_name }}-${{ github.ref_name }}-pg${{ matrix.postgres }}-x86_64-alma9.rpm
          asset_content_type: application/x-rpm
      

